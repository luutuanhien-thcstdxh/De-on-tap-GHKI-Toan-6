<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Giữa Học Kỳ I - Môn Toán Lớp 6 (Bộ Đề Chuẩn KNTT)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Hiệu ứng chữ 3D cho tên trường */
        .text-3d-school {
            text-shadow: 1px 1px 0px #1e40af, 2px 2px 0px #1e3a8a, 3px 3px 4px rgba(0,0,0,0.6);
        }
        
        /* Hiệu ứng chữ 3D cho Tiêu đề chính */
        .text-3d-title {
            text-shadow: 1px 1px 0 #0284c7, 2px 2px 0 #0369a1, 3px 3px 0 #075985, 4px 4px 0 #0f172a, 5px 5px 12px rgba(0,0,0,0.5);
        }
        
        /* Hiệu ứng chữ 3D cho Tiêu đề phụ (Toán 6) */
        .text-3d-subtitle {
            text-shadow: 1px 1px 0 #b45309, 2px 2px 0 #92400e, 3px 3px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col" x-data="mathQuizApp()">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 grid grid-cols-1 md:grid-cols-3 items-center gap-4">
            
            <!-- Left: Tên Trường -->
            <div class="flex justify-center md:justify-start items-center">
                <div class="text-center md:text-left cursor-pointer hover:scale-105 transition-transform duration-300" @click="resetToHome()">
                    <h2 class="text-sm sm:text-base font-extrabold text-amber-300 uppercase tracking-wider text-3d-school leading-tight">
                        Trường THCS Xuân Hòa
                    </h2>
                    <p class="text-xs sm:text-sm font-bold text-white uppercase tracking-widest text-3d-school leading-tight mt-0.5">
                        Phân hiệu Tân Dương
                    </p>
                </div>
            </div>
            
            <!-- Center: App Title (3D) -->
            <div class="flex flex-col items-center justify-center text-center cursor-pointer group" @click="resetToHome()">
                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black text-white text-3d-title uppercase tracking-widest group-hover:scale-105 transition-transform duration-300">
                    Ôn Tập Giữa Kì I
                </h1>
                <h2 class="text-lg sm:text-xl font-extrabold text-amber-400 text-3d-subtitle mt-1 uppercase tracking-widest group-hover:scale-105 transition-transform duration-300">
                    Toán Lớp 6
                </h2>
            </div>
            
            <!-- Right: GV Info & Timer -->
            <div class="flex items-center justify-center md:justify-end gap-3">
                <div class="flex items-center gap-2.5 bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-white shadow-sm hover:bg-white/20 transition duration-300">
                    <div class="w-8 h-8 rounded-full bg-amber-400 flex items-center justify-center text-slate-900 shadow-inner">
                        <i class="fa-solid fa-user-tie text-xs"></i>
                    </div>
                    <div class="text-left hidden lg:block">
                        <p class="text-[9px] text-blue-200 uppercase tracking-widest leading-tight font-medium">Thiết kế & Biên soạn</p>
                        <p class="text-xs font-bold tracking-wide text-white drop-shadow-md">GV Lưu Tuấn Hiện</p>
                    </div>
                    <!-- Hiển thị ngắn gọn trên điện thoại -->
                    <div class="text-left block lg:hidden">
                        <p class="text-xs font-bold text-white drop-shadow-md">GV Hiện</p>
                    </div>
                </div>

                <template x-if="currentExam !== null && !isSubmitted">
                    <div class="bg-blue-800/80 px-3 py-1.5 rounded-xl border border-blue-600 flex items-center gap-2 text-sm font-medium">
                        <i class="fa-regular fa-clock text-amber-300 animate-pulse"></i>
                        <span class="font-bold text-amber-300" x-text="formatTime(timeLeft)"></span>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">

        <!-- VIEW 1: HOME / EXAM SELECTOR -->
        <template x-if="currentExam === null">
            <div class="space-y-8">
                <div class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 opacity-10 translate-x-10 translate-y-10">
                        <i class="fa-solid fa-graduation-cap text-9xl"></i>
                    </div>
                    <div class="relative z-10 max-w-2xl">
                        <span class="bg-amber-400 text-slate-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Hệ thống ôn thi tương tác</span>
                        <h2 class="text-3xl font-extrabold mt-3 mb-2">Chinh Phục Điểm 10 Toán 6</h2>
                        <p class="text-blue-50 text-sm leading-relaxed mb-6">
                            Bộ 5 đề kiểm tra bám sát ma trận chuẩn GDPT 2018. Bao gồm Phần I (12 câu trắc nghiệm nhiều lựa chọn), Phần II (2 câu Đúng/Sai), Phần III (4 câu Trả lời ngắn), và Phần IV (3 bài Tự luận chi tiết). Làm bài trực tiếp, tải ảnh bài giải viết tay và nhận điểm số + lời giải ngay lập tức!
                        </p>
                    </div>
                </div>

                <div>
                    <h3 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-blue-600"></i> Chọn đề ôn tập để bắt đầu:
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="(exam, index) in exams" :key="index">
                            <div @click="startExam(index)" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md transition border border-slate-100 hover:border-blue-300 cursor-pointer flex flex-col justify-between group">
                                <div>
                                    <div class="flex justify-between items-start mb-4">
                                        <span class="bg-blue-50 text-blue-600 font-bold text-xs px-3 py-1.5 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition" x-text="index < 9 ? `ĐỀ SỐ 0${index + 1}` : `ĐỀ SỐ ${index + 1}`"></span>
                                        <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>90 phút</span>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-lg mb-2 group-hover:text-blue-600 transition" x-text="exam.title"></h4>
                                    <p class="text-xs text-slate-500 leading-relaxed mb-4">Trắc nghiệm (7.0đ) + Tự luận (3.0đ) chuẩn cấu trúc đánh giá giữa kỳ I.</p>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-blue-600 font-semibold text-sm">
                                    <span>Vào làm bài</span>
                                    <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- VIEW 2: EXAM TAKING & REVIEW MODE -->
        <template x-if="currentExam !== null">
            <div class="space-y-8">
                <!-- Top Navigation & Score Banner -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200 gap-4">
                    <button @click="resetToHome()" class="text-sm font-semibold text-slate-600 hover:text-blue-600 flex items-center gap-2 transition">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách đề
                    </button>
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                        <template x-if="!isSubmitted">
                            <button @click="submitExam()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition text-sm">
                                Nộp bài & Xem kết quả
                            </button>
                        </template>
                        <template x-if="isSubmitted">
                            <button @click="resetExam()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2.5 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Làm lại đề này
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Score Result Banner (When Submitted) -->
                <template x-if="isSubmitted">
                    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row items-center justify-between gap-4 animate-fade-in">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl font-bold backdrop-blur-sm">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold">Đã nộp bài thành công!</h3>
                                <p class="text-emerald-100 text-sm">Điểm trắc nghiệm (Phần I, II, III): <span class="font-bold text-white text-lg" x-text="calculatedScore"></span> / 7.0 điểm</p>
                            </div>
                        </div>
                        <div class="text-right bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm">
                            <p class="text-xs text-emerald-100">Lời khuyên:</p>
                            <p class="text-sm font-medium">Xem kỹ phần giải thích chi tiết bên dưới cho các câu làm sai.</p>
                        </div>
                    </div>
                </template>

                <!-- EXAM CONTENT CONTAINER -->
                <div class="space-y-10">
                    <div class="text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-blue-600 uppercase tracking-widest" x-text="currentExam < 9 ? `ĐỀ SỐ 0${currentExam + 1}` : `ĐỀ SỐ ${currentExam + 1}`"></span>
                        <h2 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="exams[currentExam].title"></h2>
                    </div>

                    <!-- PART I: MULTIPLE CHOICE -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN I. TRẮC NGHIỆM NHIỀU PHƯƠNG ÁN LỰA CHỌN (3,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Mỗi câu trả lời đúng được 0,25 điểm. Chọn một đáp án duy nhất.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part1" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-3">
                                    <div class="font-semibold text-slate-800 flex items-start gap-2">
                                        <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-0 sm:pl-12">
                                        <template x-for="(opt, optIndex) in q.options" :key="optIndex">
                                            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:border-blue-400 cursor-pointer transition text-sm"
                                                   :class="{
                                                       'bg-emerald-50 border-emerald-500 font-semibold text-emerald-900': isSubmitted && optIndex === q.correct,
                                                       'bg-rose-50 border-rose-500 text-rose-900': isSubmitted && userAnswers.part1[qIndex] === optIndex && optIndex !== q.correct
                                                   }">
                                                <input type="radio" :name="`part1_${qIndex}`" :value="optIndex" x-model.number="userAnswers.part1[qIndex]" :disabled="isSubmitted" class="text-blue-600 focus:ring-blue-500">
                                                <span x-text="opt"></span>
                                            </label>
                                        </template>
                                    </div>
                                    <!-- Rationale -->
                                    <template x-if="isSubmitted">
                                        <div class="mt-2 pl-0 sm:pl-12 text-xs text-slate-600 bg-blue-50/60 p-3 rounded-lg border border-blue-100">
                                            <span class="font-bold text-blue-700">Hướng dẫn giải:</span> <span x-text="q.rationale"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART II: TRUE / FALSE -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN II. TRẮC NGHIỆM ĐÚNG / SAI (2,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Mỗi câu có 4 ý a, b, c, d. Thí sinh chọn Đúng hoặc Sai cho mỗi ý.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part2" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-4">
                                    <div class="font-semibold text-slate-800 flex items-start gap-2">
                                        <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>
                                    <div class="space-y-3 pl-0 sm:pl-12">
                                        <template x-for="(item, itemIndex) in q.items" :key="itemIndex">
                                            <div class="p-3 bg-white rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm">
                                                <div class="flex items-start gap-2 flex-1">
                                                    <span class="font-bold text-blue-600" x-text="['a)', 'b)', 'c)', 'd)'][itemIndex]"></span>
                                                    <span x-text="item.text"></span>
                                                </div>
                                                <div class="flex items-center gap-4">
                                                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                                                        <input type="radio" :name="`part2_${qIndex}_${itemIndex}`" :checked="userAnswers.part2[qIndex]?.[itemIndex] === true" @change="setPart2(qIndex, itemIndex, true)" :disabled="isSubmitted" class="text-blue-600"> Đúng
                                                    </label>
                                                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                                                        <input type="radio" :name="`part2_${qIndex}_${itemIndex}`" :checked="userAnswers.part2[qIndex]?.[itemIndex] === false" @change="setPart2(qIndex, itemIndex, false)" :disabled="isSubmitted" class="text-blue-600"> Sai
                                                    </label>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    <!-- Rationale for Part II -->
                                    <template x-if="isSubmitted">
                                        <div class="mt-2 pl-0 sm:pl-12 text-xs text-slate-600 bg-blue-50/60 p-3 rounded-lg border border-blue-100 space-y-1">
                                            <p class="font-bold text-blue-700">Giải thích chi tiết:</p>
                                            <template x-for="(item, itemIndex) in q.items">
                                                <p><span class="font-semibold" x-text="['a)', 'b)', 'c)', 'd)'][itemIndex]"></span> <span class="font-bold" :class="item.isCorrect ? 'text-emerald-700' : 'text-rose-700'" x-text="item.isCorrect ? '[Đúng]' : '[Sai]'"></span> <span x-text="item.rationale"></span></p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART III: SHORT ANSWER -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN III. TRẮC NGHIỆM TRẢ LỜI NGẮN (2,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Điền đáp số ngắn gọn vào ô trống. Mỗi câu đúng được 0,5 điểm.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <template x-for="(q, qIndex) in exams[currentExam].part3" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-3 flex flex-col justify-between">
                                    <div>
                                        <div class="font-semibold text-slate-800 flex items-start gap-2 mb-3">
                                            <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                            <span class="flex-1" x-text="q.question"></span>
                                        </div>
                                    </div>
                                    <div class="space-y-2">
                                        <div class="flex items-center gap-3">
                                            <input type="text" x-model="userAnswers.part3[qIndex]" :disabled="isSubmitted" placeholder="Nhập đáp số..." class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                                        </div>
                                        <template x-if="isSubmitted">
                                            <div class="text-xs p-2.5 rounded-lg border" :class="isPart3Correct(qIndex) ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-200'">
                                                <span class="font-bold">Đáp án đúng:</span> <span x-text="q.correctAnswer"></span> | <span x-text="q.rationale"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART IV: ESSAY (TỰ LUẬN) -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN IV. TỰ LUẬN (3,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Trình bày chi tiết lời giải ra giấy hoặc vào ô bên dưới. Học sinh có thể tải ảnh bài giải viết tay lên. Đáp án và hướng dẫn giải chi tiết sẽ hiện sau khi nộp bài.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part4" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-4">
                                    <div class="font-bold text-slate-800 flex items-start gap-2">
                                        <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Bài ${qIndex + 1} (${q.score}đ)`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>

                                    <div class="pl-0 sm:pl-12 space-y-3">
                                        <!-- Text Nháp -->
                                        <textarea x-model="userAnswers.part4[qIndex]" :disabled="isSubmitted" placeholder="Học sinh có thể viết nháp lời giải bằng văn bản tại đây..." rows="3" class="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm bg-white"></textarea>
                                        
                                        <!-- File Upload Box -->
                                        <div class="flex items-center gap-3">
                                            <label class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg cursor-pointer border border-slate-300 transition text-sm font-medium">
                                                <i class="fa-solid fa-camera text-blue-600"></i> Tải ảnh bài giải viết tay
                                                <input type="file" accept="image/*" class="hidden" :disabled="isSubmitted" @change="handleImageUpload($event, qIndex)">
                                            </label>
                                            <span class="text-xs text-slate-400 italic">Hỗ trợ JPG, PNG</span>
                                        </div>

                                        <!-- Image Preview (Hiển thị ảnh đã tải lên) -->
                                        <template x-if="userImages.part4 && userImages.part4[qIndex]">
                                            <div class="mt-3 relative inline-block">
                                                <img :src="userImages.part4[qIndex]" class="max-w-full h-auto max-h-64 rounded-lg border border-slate-200 shadow-sm" alt="Bài làm của học sinh">
                                                <template x-if="!isSubmitted">
                                                    <button @click="userImages.part4[qIndex] = null" class="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-rose-600 shadow-md">
                                                        <i class="fa-solid fa-xmark text-xs"></i>
                                                    </button>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- Hướng dẫn chấm (Hiện khi nộp) -->
                                        <template x-if="isSubmitted">
                                            <div class="bg-blue-50/80 p-4 rounded-xl border border-blue-100 space-y-2 mt-4">
                                                <p class="text-xs font-bold text-blue-700 uppercase tracking-wide"><i class="fa-solid fa-circle-check mr-1"></i> Hướng dẫn chấm & Lời giải chi tiết:</p>
                                                <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line" x-text="q.solution"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Bottom Submit Button -->
                    <template x-if="!isSubmitted">
                        <div class="text-center pt-4">
                            <button @click="submitExam()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-4 rounded-2xl shadow-lg transition text-base">
                                Nộp Bài & Xem Điểm Số Trắc Nghiệm Ngay
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Custom Warning Modal -->
        <template x-if="showWarning">
            <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">

                setPart2(qIdx, itemIdx, value) {
                    if (!this.userAnswers.part2[qIdx]) this.userAnswers.part2[qIdx] = {};
                    this.userAnswers.part2[qIdx][itemIdx] = value;
                },

                normalizeAnswer(value) {
                    return String(value ?? '')
                        .toLowerCase()
                        .replace(/\s+/g, '')
                        .replace(/;/g, ',')
                        .replace(/(\d)\.(?=\d{3}(?!\d))/g, '$1');
                },

                isPart3Correct(idx) {
                    const given = this.userAnswers.part3[idx];
                    if (given === undefined) return false;
                    const q = this.exams[this.currentExam].part3[idx];
                    return this.normalizeAnswer(given) === this.normalizeAnswer(q.correctAnswer);
                },

                startExam(index) {
                    this.currentExam = index;
                    this.isSubmitted = false;
                    this.showWarning = false;
                    this.calculatedScore = 0;
                    this.userAnswers = { part1: {}, part2: {}, part3: {}, part4: {} };
                    this.userImages = { part4: {} };
                    this.timeLeft = 5400;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.startTimer();
                },

                resetToHome() {
                    this.currentExam = null;
                    this.isSubmitted = false;
                    this.showWarning = false;
                    clearInterval(this.timer);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                resetExam() {
                    this.isSubmitted = false;
                    this.showWarning = false;
                    this.calculatedScore = 0;
                    this.userAnswers = { part1: {}, part2: {}, part3: {}, part4: {} };
                    this.userImages = { part4: {} };
                    this.timeLeft = 5400;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.startTimer();
                },

                startTimer() {
                    clearInterval(this.timer);
                    this.timer = setInterval(() => {
                        if (this.timeLeft > 0 && !this.isSubmitted) {
                            this.timeLeft--;
                        } else if (this.timeLeft === 0 && !this.isSubmitted) {
                            clearInterval(this.timer);
                            this.submitExam(true);
                        }
                    }, 1000);
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },

                submitExam(isForceSubmit = false) {
                    if (this.isSubmitted) return;

                    // Chỉ cho phép nộp bài khi thời gian còn lại <= 2700s (đã làm > 45 phút) hoặc khi hết giờ (force)
                    if (!isForceSubmit && this.timeLeft > 2700) {
                        this.showWarning = true;
                        return;
                    }

                    this.showWarning = false;
                    clearInterval(this.timer);
                    let score = 0;
                    const exam = this.exams[this.currentExam];

                    // Score Part I (12 questions, 0.25 pt each = 3.0 pts max)
                    exam.part1.forEach((q, idx) => {
                        if (this.userAnswers.part1[idx] === q.correct) {
                            score += 0.25;
                        }
                    });

                    // Score Part II (2 questions, 4 items each = 1.0 pt each = 2.0 pts max)
                    // Grading rule: 1 correct = 0.10, 2 correct = 0.25, 3 correct = 0.50, 4 correct = 1.00
                    exam.part2.forEach((q, qIdx) => {
                        let correctCount = 0;
                        q.items.forEach((item, itemIdx) => {
                            if (this.userAnswers.part2[qIdx] && this.userAnswers.part2[qIdx][itemIdx] === item.isCorrect) {
                                correctCount++;
                            }
                        });
                        if (correctCount === 1) score += 0.10;
                        else if (correctCount === 2) score += 0.25;
                        else if (correctCount === 3) score += 0.50;
                        else if (correctCount === 4) score += 1.00;
                    });

                    // Score Part III (4 questions, 0.5 pt each = 2.0 pts max)
                    exam.part3.forEach((q, idx) => {
                        if (this.isPart3Correct(idx)) {
                            score += 0.5;
                        }
                    });

                    this.calculatedScore = Number(score.toFixed(2));
                    this.isSubmitted = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                handleImageUpload(event, qIndex) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            if (!this.userImages.part4) this.userImages.part4 = {};
                            this.userImages.part4[qIndex] = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                }
            }
        }
