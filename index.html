<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Giữa Học Kỳ I - Môn Toán Lớp 6 (Bộ 5 Đề Chuẩn KNTT)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col" x-data="mathQuizApp()">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetToHome()">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-calculator text-2xl text-amber-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight"> Hệ thống ôn Tập Giữa Kỳ I - Toán Lớp 6 của Thầy Lưu Tuấn Hiện THCS Xuân Hòa-Phân hiệu Tân Dương</h1>
                    <p class="text-xs text-indigo-200">Sách Kết Nối Tri Thức Với Cuộc Sống (70% Trắc nghiệm - 30% Tự luận)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <template x-if="currentExam !== null && !isSubmitted">
                    <div class="bg-indigo-800/80 px-4 py-2 rounded-xl border border-indigo-600 flex items-center gap-2 text-sm font-medium">
                        <i class="fa-regular fa-clock text-amber-300"></i>
                        <span>Thời gian: <span x-text="formatTime(timeLeft)" class="font-bold text-amber-300"></span></span>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow">

        <!-- VIEW 1: HOME / EXAM SELECTOR -->
        <template x-if="currentExam === null">
            <div class="space-y-8">
                <div class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 opacity-10 translate-x-10 translate-y-10">
                        <i class="fa-solid fa-graduation-cap text-9xl"></i>
                    </div>
                    <div class="relative z-10 max-w-2xl">
                        <span class="bg-amber-400 text-slate-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Hệ thống ôn thi tương tác</span>
                        <h2 class="text-3xl font-extrabold mt-3 mb-2">Chinh Phục Điểm 10 Toán 6</h2>
                        <p class="text-indigo-100 text-sm leading-relaxed">
                            Bộ 5 đề kiểm tra bám sát ma trận chuẩn GDPT 2018. Bao gồm Phần I (12 câu trắc nghiệm nhiều lựa chọn), Phần II (2 câu Đúng/Sai), Phần III (4 câu Trả lời ngắn), và Phần IV (3 bài Tự luận chi tiết). Làm bài trực tiếp và nhận điểm số + lời giải ngay lập tức!
                        </p>
                    </div>
                </div>

                <div>
                    <h3 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-indigo-600"></i> Chọn đề ôn tập để bắt đầu:
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <template x-for="(exam, index) in exams" :key="index">
                            <div @click="startExam(index)" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md transition border border-slate-100 hover:border-indigo-300 cursor-pointer flex flex-col justify-between group">
                                <div>
                                    <div class="flex justify-between items-start mb-4">
                                        <span class="bg-indigo-50 text-indigo-600 font-bold text-xs px-3 py-1.5 rounded-lg group-hover:bg-indigo-600 group-hover:text-white transition" x-text="`ĐỀ SỐ 0${index + 1}`"></span>
                                        <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>90 phút</span>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-lg mb-2 group-hover:text-indigo-600 transition" x-text="exam.title"></h4>
                                    <p class="text-xs text-slate-500 leading-relaxed mb-4">Trắc nghiệm (7.0đ) + Tự luận (3.0đ) chuẩn cấu trúc đánh giá giữa kỳ I.</p>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-indigo-600 font-semibold text-sm">
                                    <span>Vào làm bài</span>
                                    <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- VIEW 2: EXAM TAKING & REVIEW MODE -->
        <template x-if="currentExam !== null">
            <div class="space-y-8">
                <!-- Top Navigation & Score Banner -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200 gap-4">
                    <button @click="resetToHome()" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 flex items-center gap-2 transition">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách đề
                    </button>
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                        <template x-if="!isSubmitted">
                            <button @click="submitExam()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition text-sm">
                                Nộp bài & Xem kết quả
                            </button>
                        </template>
                        <template x-if="isSubmitted">
                            <button @click="resetExam()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2.5 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Làm lại đề này
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Score Result Banner (When Submitted) -->
                <template x-if="isSubmitted">
                    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row items-center justify-between gap-4 animate-fade-in">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl font-bold backdrop-blur-sm">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold">Đã nộp bài thành công!</h3>
                                <p class="text-emerald-100 text-sm">Điểm trắc nghiệm (Phần I, II, III): <span class="font-bold text-white text-lg" x-text="calculatedScore"></span> / 7.0 điểm</p>
                            </div>
                        </div>
                        <div class="text-right bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm">
                            <p class="text-xs text-emerald-100">Lời khuyên:</p>
                            <p class="text-sm font-medium">Xem kỹ phần giải thích chi tiết bên dưới cho các câu làm sai.</p>
                        </div>
                    </div>
                </template>

                <!-- EXAM CONTENT CONTAINER -->
                <div class="space-y-10">
                    <div class="text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-widest" x-text="`ĐỀ SỐ 0${currentExam + 1}`"></span>
                        <h2 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="exams[currentExam].title"></h2>
                    </div>

                    <!-- PART I: MULTIPLE CHOICE -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN I. TRẮC NGHIỆM NHIỀU PHƯƠNG ÁN LỰA CHỌN (3,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Mỗi câu trả lời đúng được 0,25 điểm. Chọn một đáp án duy nhất.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part1" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-3">
                                    <div class="font-semibold text-slate-800 flex items-start gap-2">
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-0 sm:pl-12">
                                        <template x-for="(opt, optIndex) in q.options" :key="optIndex">
                                            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:border-indigo-400 cursor-pointer transition text-sm"
                                                   :class="{
                                                       'bg-emerald-50 border-emerald-500 font-semibold text-emerald-900': isSubmitted && optIndex === q.correct,
                                                       'bg-rose-50 border-rose-500 text-rose-900': isSubmitted && userAnswers.part1[qIndex] === optIndex && optIndex !== q.correct
                                                   }">
                                                <input type="radio" :name="`part1_${qIndex}`" :value="optIndex" x-model.number="userAnswers.part1[qIndex]" :disabled="isSubmitted" class="text-indigo-600 focus:ring-indigo-500">
                                                <span x-text="opt"></span>
                                            </label>
                                        </template>
                                    </div>
                                    <!-- Rationale -->
                                    <template x-if="isSubmitted">
                                        <div class="mt-2 pl-0 sm:pl-12 text-xs text-slate-600 bg-indigo-50/60 p-3 rounded-lg border border-indigo-100">
                                            <span class="font-bold text-indigo-700">Hướng dẫn giải:</span> <span x-text="q.rationale"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART II: TRUE / FALSE -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN II. TRẮC NGHIỆM ĐÚNG / SAI (2,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Mỗi câu có 4 ý a, b, c, d. Thí sinh chọn Đúng hoặc Sai cho mỗi ý.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part2" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-4">
                                    <div class="font-semibold text-slate-800 flex items-start gap-2">
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>
                                    <div class="space-y-3 pl-0 sm:pl-12">
                                        <template x-for="(item, itemIndex) in q.items" :key="itemIndex">
                                            <div class="p-3 bg-white rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm">
                                                <div class="flex items-start gap-2 flex-1">
                                                    <span class="font-bold text-indigo-600" x-text="['a)', 'b)', 'c)', 'd)'][itemIndex]"></span>
                                                    <span x-text="item.text"></span>
                                                </div>
                                                <div class="flex items-center gap-4">
                                                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                                                        <input type="radio" :name="`part2_${qIndex}_${itemIndex}`" :checked="userAnswers.part2[qIndex]?.[itemIndex] === true" @change="setPart2(qIndex, itemIndex, true)" :disabled="isSubmitted" class="text-indigo-600"> Đúng
                                                    </label>
                                                    <label class="flex items-center gap-1.5 cursor-pointer font-medium">
                                                        <input type="radio" :name="`part2_${qIndex}_${itemIndex}`" :checked="userAnswers.part2[qIndex]?.[itemIndex] === false" @change="setPart2(qIndex, itemIndex, false)" :disabled="isSubmitted" class="text-indigo-600"> Sai
                                                    </label>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    <!-- Rationale for Part II -->
                                    <template x-if="isSubmitted">
                                        <div class="mt-2 pl-0 sm:pl-12 text-xs text-slate-600 bg-indigo-50/60 p-3 rounded-lg border border-indigo-100 space-y-1">
                                            <p class="font-bold text-indigo-700">Giải thích chi tiết:</p>
                                            <template x-for="(item, itemIndex) in q.items">
                                                <p><span class="font-semibold" x-text="['a)', 'b)', 'c)', 'd)'][itemIndex]"></span> <span class="font-bold" :class="item.isCorrect ? 'text-emerald-700' : 'text-rose-700'" x-text="item.isCorrect ? '[Đúng]' : '[Sai]'"></span> <span x-text="item.rationale"></span></p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART III: SHORT ANSWER -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN III. TRẮC NGHIỆM TRẢ LỜI NGẮN (2,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Điền đáp số ngắn gọn vào ô trống. Mỗi câu đúng được 0,5 điểm.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <template x-for="(q, qIndex) in exams[currentExam].part3" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-3 flex flex-col justify-between">
                                    <div>
                                        <div class="font-semibold text-slate-800 flex items-start gap-2 mb-3">
                                            <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Câu ${qIndex + 1}`"></span>
                                            <span class="flex-1" x-text="q.question"></span>
                                        </div>
                                    </div>
                                    <div class="space-y-2">
                                        <div class="flex items-center gap-3">
                                            <input type="text" x-model="userAnswers.part3[qIndex]" :disabled="isSubmitted" placeholder="Nhập đáp số..." class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                                        </div>
                                        <template x-if="isSubmitted">
                                            <div class="text-xs p-2.5 rounded-lg border" :class="isPart3Correct(qIndex) ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-200'">
                                                <span class="font-bold">Đáp án đúng:</span> <span x-text="q.correctAnswer"></span> | <span x-text="q.rationale"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- PART IV: ESSAY (TỰ LUẬN) -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
                        <div class="border-b border-slate-100 pb-4">
                            <h3 class="text-lg font-bold text-slate-900">PHẦN IV. TỰ LUẬN (3,0 điểm)</h3>
                            <p class="text-xs text-slate-500 mt-1">Trình bày chi tiết lời giải ra giấy và đối chiếu với Hướng dẫn giải chi tiết bên dưới.</p>
                        </div>

                        <div class="space-y-6">
                            <template x-for="(q, qIndex) in exams[currentExam].part4" :key="qIndex">
                                <div class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 space-y-4">
                                    <div class="font-bold text-slate-800 flex items-start gap-2">
                                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold mt-0.5" x-text="`Bài ${qIndex + 1} (${q.score}đ)`"></span>
                                        <span class="flex-1" x-text="q.question"></span>
                                    </div>

                                    <div class="pl-0 sm:pl-12 space-y-3">
                                        <textarea x-model="userAnswers.part4[qIndex]" :disabled="isSubmitted" placeholder="Học sinh có thể viết nháp hoặc trình bày lời giải tại đây..." rows="4" class="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-white"></textarea>
                                        
                                        <div class="bg-indigo-50/80 p-4 rounded-xl border border-indigo-100 space-y-2">
                                            <p class="text-xs font-bold text-indigo-700 uppercase tracking-wide"><i class="fa-solid fa-circle-check mr-1"></i> Hướng dẫn chấm & Lời giải chi tiết:</p>
                                            <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line" x-text="q.solution"></p>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Bottom Submit Button -->
                    <template x-if="!isSubmitted">
                        <div class="text-center pt-4">
                            <button @click="submitExam()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-4 rounded-2xl shadow-lg transition text-base">
                                Nộp Bài & Xem Điểm Số Trắc Nghiệm Ngay
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
        <p>Hệ thống Ôn tập Kiểm tra Giữa kỳ I môn Toán 6 - Chuẩn kiến thức SGK Kết Nối Tri Thức Với Cuộc Sống.</p>
    </footer>

    <!-- Script Application Logic -->
    <script>
        function mathQuizApp() {
            return {
                currentExam: null,
                isSubmitted: false,
                calculatedScore: 0,
                timeLeft: 5400, // 90 minutes in seconds
                timer: null,
                userAnswers: {
                    part1: {},
                    part2: {},
                    part3: {},
                    part4: {}
                },
                exams: [
                    {
                        title: "ĐỀ KIỂM TRA GIỮA HỌC KỲ I - ĐỀ SỐ 01",
                        part1: [
                            { question: "Cho tập hợp A = {3; 6; 9; 12}. Khẳng định nào sau đây là đúng?", options: ["6 ∉ A", "5 ∈ A", "9 ∈ A", "12 ∉ A"], correct: 2, rationale: "Số 9 thuộc tập hợp A nên 9 ∈ A là khẳng định đúng." },
                            { question: "Số 28 được biểu diễn bằng số La Mã là:", options: ["XXVIII", "XXVII", "XXIIII", "XXXVIII"], correct: 0, rationale: "XXVIII tương ứng với 20 + 5 + 3 = 28." },
                            { question: "Cho ba số tự nhiên a, b, c thỏa mãn a < 25 và 25 < b. Phát biểu nào sau đây đúng?", options: ["a > b", "a < b", "a = b", "a + b = 50"], correct: 1, rationale: "Vì a < 25 và 25 < b nên suy ra a < b." },
                            { question: "Trong biểu thức 7^4, cơ số là:", options: ["4", "28", "7", "11"], correct: 2, rationale: "Trong lũy thừa 7^4, số 7 là cơ số và 4 là số mũ." },
                            { question: "Kết quả của phép tính 2^3 . 3 - 5 là:", options: ["19", "1", "13", "4"], correct: 0, rationale: "2^3 . 3 - 5 = 8 . 3 - 5 = 24 - 5 = 19." },
                            { question: "Cho tổng S = 12 + 24 + 36 + x. Điều kiện của x để S chia hết cho 6 là:", options: ["x chia hết cho 6", "x chia 6 dư 1", "x là số lẻ bất kỳ", "x chia 6 dư 2"], correct: 0, rationale: "Các số hạng 12, 24, 36 đều chia hết cho 6, vậy để S chia hết cho 6 thì x phải chia hết cho 6." },
                            { question: "Số nào sau đây chia hết cho cả 3 và 5?", options: ["125", "240", "305", "123"], correct: 1, rationale: "Số 240 tận cùng là 0 (chia hết cho 5) và có tổng các chữ số là 2+4+0 = 6 chia hết cho 3." },
                            { question: "Trong các số sau, số nào là hợp số?", options: ["11", "17", "21", "23"], correct: 2, rationale: "Số 21 chia hết cho 1, 3, 7, 21 nên 21 là hợp số. Các số còn lại là số nguyên tố." },
                            { question: "Ước chung lớn nhất của 18 và 30 là:", options: ["3", "6", "90", "15"], correct: 1, rationale: "18 = 2 . 3^2, 30 = 2 . 3 . 5 => ƯCLN(18, 30) = 2 . 3 = 6." },

                setPart2(qIdx, itemIdx, value) {
                    if (!this.userAnswers.part2[qIdx]) this.userAnswers.part2[qIdx] = {};

                normalizeAnswer(value) {
                    return String(value ?? '')
                        .toLowerCase()
                        .replace(/\s+/g, '')
                        .replace(/;/g, ',')
                        .replace(/(\d)\.(?=\d{3}(?!\d))/g, '$1');
                },

                    const given = this.userAnswers.part3[idx];
                    if (given === undefined) return false;
                    const q = this.exams[this.currentExam].part3[idx];
                    return this.normalizeAnswer(given) === this.normalizeAnswer(q.correctAnswer);
                },

                    this.timeLeft = 5400;
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                },

                startTimer() {
                    clearInterval(this.timer);
                    this.timer = setInterval(() => {
                        if (this.timeLeft > 0 && !this.isSubmitted) {
                            this.timeLeft--;
                        } else if (this.timeLeft === 0 && !this.isSubmitted) {
                            clearInterval(this.timer);
                            this.submitExam();
                        }
                    }, 1000);
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },

                submitExam() {
                    if (this.isSubmitted) return;
                    clearInterval(this.timer);
                    let score = 0;
                    const exam = this.exams[this.currentExam];

                    // Score Part I (12 questions, 0.25 pt each = 3.0 pts max)
                    exam.part1.forEach((q, idx) => {
                        if (this.userAnswers.part1[idx] === q.correct) {
                            score += 0.25;
                        }
                    });

                    // Score Part II (2 questions, 4 items each = 1.0 pt each = 2.0 pts max)
                    // Grading rule: 1 correct = 0.10, 2 correct = 0.25, 3 correct = 0.50, 4 correct = 1.00
                    exam.part2.forEach((q, qIdx) => {
                        let correctCount = 0;
                        q.items.forEach((item, itemIdx) => {
                            if (this.userAnswers.part2[qIdx] && this.userAnswers.part2[qIdx][itemIdx] === item.isCorrect) {
                                correctCount++;
                            }
                        });
                        if (correctCount === 1) score += 0.10;
                        else if (correctCount === 2) score += 0.25;
                        else if (correctCount === 3) score += 0.50;
                        else if (correctCount === 4) score += 1.00;
                    });

                    // Score Part III (4 questions, 0.5 pt each = 2.0 pts max)
                    exam.part3.forEach((q, idx) => {
                        if (this.isPart3Correct(idx)) {
                            score += 0.5;
                        }
                    });

                    this.calculatedScore = Number(score.toFixed(2));
                    this.isSubmitted = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
